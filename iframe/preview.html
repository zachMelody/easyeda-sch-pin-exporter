<!doctype html>
<html lang="zh-Hans">
<head>
	<title>引脚列表预览</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			font-size: 14px;
			line-height: 1.6;
			color: #333;
			background: #fff;
			display: flex;
			flex-direction: column;
			height: 100vh;
		}
		.toolbar {
			display: flex;
			gap: 8px;
			padding: 12px 16px;
			background: #f5f5f5;
			border-bottom: 1px solid #e0e0e0;
			flex-shrink: 0;
		}
		.toolbar button {
			padding: 6px 16px;
			border: 1px solid #d0d0d0;
			border-radius: 4px;
			background: #fff;
			cursor: pointer;
			font-size: 14px;
		}
		.toolbar button:hover {
			background: #f0f0f0;
		}
		.toolbar button.primary {
			background: #1890ff;
			border-color: #1890ff;
			color: #fff;
		}
		.toolbar button.primary:hover {
			background: #40a9ff;
		}
		.toolbar .spacer {
			flex: 1;
		}
		.toolbar .info {
			display: flex;
			align-items: center;
			color: #666;
			font-size: 13px;
		}
		.content {
			flex: 1;
			overflow: auto;
			padding: 16px 24px;
		}
		/* Markdown styles */
		.content h1 {
			font-size: 24px;
			margin-bottom: 16px;
			padding-bottom: 8px;
			border-bottom: 2px solid #eee;
		}
		.content h2 {
			font-size: 18px;
			margin: 24px 0 12px;
			color: #1890ff;
		}
		.content h3 {
			font-size: 15px;
			margin: 16px 0 8px;
			color: #666;
		}
		.content blockquote {
			margin: 8px 0;
			padding: 8px 12px;
			background: #f9f9f9;
			border-left: 4px solid #1890ff;
			color: #666;
		}
		.content hr {
			border: none;
			border-top: 1px solid #eee;
			margin: 16px 0;
		}
		.content ul {
			margin: 8px 0;
			padding-left: 24px;
		}
		.content li {
			margin: 4px 0;
		}
		.content table {
			width: 100%;
			border-collapse: collapse;
			margin: 12px 0;
			font-size: 13px;
		}
		.content th, .content td {
			border: 1px solid #e0e0e0;
			padding: 8px 12px;
			text-align: left;
		}
		.content th {
			background: #fafafa;
			font-weight: 600;
		}
		.content tr:hover {
			background: #f5f5f5;
		}
		.content em {
			color: #999;
		}
		.loading {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100%;
			color: #999;
		}
	</style>
</head>
<body>
	<div class="toolbar">
		<button class="primary" id="exportBtn">导出文件</button>
		<button id="cancelBtn">取消</button>
		<div class="spacer"></div>
		<div class="info" id="info"></div>
	</div>
	<div class="content" id="content">
		<div class="loading">加载中...</div>
	</div>
	<script>
		const TOPIC_PREVIEW_DATA = 'sch-pin-exporter:preview-data';
		const TOPIC_PREVIEW_ACTION = 'sch-pin-exporter:preview-action';

		let markdownContent = '';

		// 接收预览数据
		eda.sys_MessageBus.pull(TOPIC_PREVIEW_DATA, function(data) {
			if (data && data.html) {
				document.getElementById('content').innerHTML = data.html;
				markdownContent = data.markdown || '';
				if (data.count) {
					document.getElementById('info').textContent = '共 ' + data.count + ' 个元件';
				}
			}
		});

		// 导出按钮
		document.getElementById('exportBtn').addEventListener('click', function() {
			eda.sys_MessageBus.push(TOPIC_PREVIEW_ACTION, { action: 'export', markdown: markdownContent });
		});

		// 取消按钮
		document.getElementById('cancelBtn').addEventListener('click', function() {
			eda.sys_MessageBus.push(TOPIC_PREVIEW_ACTION, { action: 'cancel' });
		});
	</script>
</body>
</html>
